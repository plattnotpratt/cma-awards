services:
  caddy:
    image: caddy:2-alpine
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    env_file:
      - .env
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    depends_on:
      - api
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
