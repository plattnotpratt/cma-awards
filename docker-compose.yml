services:
  caddy:
    image: caddy:2-alpine
    depends_on:
      - web
    env_file:
      - .env
    command:
      - sh
      - -c
      - |
        if [ "$${CADDY_BASICAUTH_ENABLED:-true}" = "false" ]; then
          printf '%s\n' \
            'awards.catholicmediaassociation.org {' \
            '  encode gzip zstd' \
            '  reverse_proxy web:80' \
            '}' > /tmp/Caddyfile
          exec caddy run --config /tmp/Caddyfile --adapter caddyfile
        fi
        if [ -z "$$CADDY_BASICAUTH_USER" ] || [ -z "$$CADDY_BASICAUTH_PASSWORD" ]; then
          echo "CADDY_BASICAUTH_USER and CADDY_BASICAUTH_PASSWORD must be set"
          exit 1
        fi
        export CADDY_BASICAUTH_PASSWORD_HASH="$$(caddy hash-password --plaintext "$$CADDY_BASICAUTH_PASSWORD")"
        printf '%s\n' \
          'awards.catholicmediaassociation.org {' \
          '  encode gzip zstd' \
          '  basic_auth {' \
          "    $$CADDY_BASICAUTH_USER $$CADDY_BASICAUTH_PASSWORD_HASH" \
          '  }' \
          '  reverse_proxy web:80' \
          '}' > /tmp/Caddyfile
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    env_file:
      - .env
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    depends_on:
      - api
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
